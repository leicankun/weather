# Local source builds; PostgreSQL includes TimescaleDB, PostGIS and pgvector.
x-backend: &backend
  build: ./backend
  image: weather-backend:local
  working_dir: /app
  env_file:
    - ${ENV_FILE:-./backend/.env}
  environment:
    DB_URL: postgresql+asyncpg://admin:123456@postgres:5432/weather_db
    REDIS_URL: redis://redis:6379/0
services:
  postgres:
    build:
      context: .
      dockerfile: Dockerfile.pg
    image: weather-postgres:local
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: '123456'
      POSTGRES_DB: weather_db
    ports: ['127.0.0.1:5432:5432']
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./docker-entrypoint-initdb.d:/docker-entrypoint-initdb.d
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U admin -d weather_db']
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  redis:
    image: redis:7.2-alpine
    ports: ['127.0.0.1:6379:6379']
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  migrate:
    <<: *backend
    command: alembic upgrade head
    depends_on:
      postgres: {condition: service_healthy}
    restart: 'no'
  backend:
    <<: *backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    ports: ['127.0.0.1:8000:8000']
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
    restart: unless-stopped
  celery:
    <<: *backend
    command: celery -A app.celery_app worker -l info
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
    restart: unless-stopped
  celery-beat:
    <<: *backend
    command: celery -A app.celery_app beat -l info
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
    restart: unless-stopped
  frontend-user:
    build: ./frontend-user
    ports: ['127.0.0.1:8080:80']
    depends_on: [backend]
    restart: unless-stopped
  frontend-admin:
    build: ./frontend-admin
    ports: ['127.0.0.1:8081:80']
    depends_on: [backend]
    restart: unless-stopped
  mailhog:
    image: mailhog/mailhog
    profiles: [mail]
    ports: ['127.0.0.1:1025:1025', '127.0.0.1:8025:8025']
volumes:
  pg_data:
